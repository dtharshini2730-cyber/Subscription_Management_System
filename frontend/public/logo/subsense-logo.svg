<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="subsenseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#541415" />
      <stop offset="100%" stop-color="#D93645" />
    </linearGradient>
  </defs>
  <!-- Geometric Logo Icon -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#352C29" />
    <!-- Modern loop / cyclical subscription symbol -->
    <path d="M 22 28 C 22 22, 48 22, 48 35 C 48 48, 22 42, 22 55 C 22 65, 48 65, 48 58" 
          fill="none" 
          stroke="url(#subsenseGrad)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="48" cy="24" r="3.5" fill="#D93645" />
    <circle cx="22" cy="62" r="3.5" fill="#E8DAD5" />
  </g>
  
  <!-- Wordmark -->
  <text x="96" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#352C29">
    SUB<tspan fill="#D93645">SENSE</tspan>
  </text>
  <text x="98" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#9D9695">
    REVENUE &amp; SUBSCRIPTION PLATFORM
  </text>
</svg>
